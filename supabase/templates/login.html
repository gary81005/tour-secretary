<!-- 旅遊秘書登入信：同一封信同時有連結與 6 位數驗證碼（M1 Q1 (c)）。
     雲端專案要把這份內容貼到 Supabase Dashboard → Authentication → Emails。
     「Magic Link」與「Confirm signup」兩個範本都用這份。 -->
<div
  style="
    font-family: -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 24px;
    color: #1f2937;
  "
>
  <h2 style="margin: 0 0 16px; font-size: 20px">旅遊秘書登入</h2>
  <p style="margin: 0 0 8px">在登入畫面輸入以下驗證碼：</p>
  <p style="margin: 0 0 24px; font-size: 32px; font-weight: 700; letter-spacing: 8px">
    {{ .Token }}
  </p>
  <p style="margin: 0 0 16px">或在這台裝置上直接點下面的按鈕登入：</p>
  <p style="margin: 0 0 24px">
    <a
      href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
      style="
        display: inline-block;
        padding: 12px 20px;
        border-radius: 8px;
        background: #0d9488;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
      "
      >登入旅遊秘書</a
    >
  </p>
  <p style="margin: 0; font-size: 13px; color: #6b7280">
    驗證碼與連結只能使用一次，1 小時後失效。如果不是你本人要登入，請忽略這封信。
  </p>
</div>
